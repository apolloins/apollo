[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Short links for print, QR codes and word of mouth. They are printed on
# paper, so keep them working; change only the target.
[[redirects]]
  from = "/shigu"
  to = "/zh/constat"
  status = 302

[[redirects]]
  from = "/constat"
  to = "/zh/constat"
  status = 302

[[redirects]]
  from = "/faq"
  to = "/zh/faq"
  status = 302
